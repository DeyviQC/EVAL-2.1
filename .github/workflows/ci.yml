name: EVAL CI Pipeline

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'test/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit

      - name: Verify TypeScript & Tooling (Typecheck)
        run: npm run typecheck

      - name: Run 223 Automated Contract Tests
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

  backend:
    name: Backend Quality, Migrations & Server Verification
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: eval_dev
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -proot_ci_password" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Lint PHP Syntax
        run: find app tests dev-runtime -name "*.php" -exec php -l {} \; > /dev/null

      - name: Run 67 Domain & Integrity Unit Tests (PHPUnit)
        env:
          EVAL_VENDOR_DIR: ${{ github.workspace }}/backend/vendor
        run: ./vendor/bin/phpunit -c phpunit.xml --testsuite Unit

      - name: Provision MySQL Migration & Runtime Users (Least Privilege)
        run: |
          mysql -h 127.0.0.1 -P 3307 -u root -proot_ci_password -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER IF NOT EXISTS 'eval_dev_migration'@'%' IDENTIFIED BY 'ci_mig_password';
            CREATE USER IF NOT EXISTS 'eval_dev_runtime'@'%' IDENTIFIED BY 'ci_run_password';
            GRANT ALL PRIVILEGES ON eval_dev.* TO 'eval_dev_migration'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, EXECUTE, TRIGGER, CREATE TEMPORARY TABLES, LOCK TABLES ON eval_dev.* TO 'eval_dev_runtime'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Create Isolated Delivery & Material Storage Directories
        run: |
          mkdir -p ../.local/eval-dev/deliveries ../.local/eval-dev/materials

      - name: Run All 20 Database Migrations & Seed Clean DB
        env:
          EVAL_VENDOR_DIR: ${{ github.workspace }}/backend/vendor
          EVAL_UNIT: Dev
          EVAL_DB_HOST: 127.0.0.1
          EVAL_DB_PORT: '3307'
          EVAL_DB_NAME: eval_dev
          EVAL_DB_USER: eval_dev_migration
          EVAL_DB_PASSWORD: ci_mig_password
          EVAL_DB_ROLE: migration
          EVAL_DB_SSL_VERIFY: '0'
          EVAL_SEED_PASSWORD: DefaultDevPassword2026!
        run: php dev-runtime/ci-prepare.php

      - name: Verify Clean Schema & Migration Count
        run: |
          mysql -h 127.0.0.1 -P 3307 -u eval_dev_migration -pci_mig_password eval_dev -e "
            SELECT count(*) as total_migrations FROM migrations;
            SHOW TABLES;
          "

      - name: Run Master Backend Server Verification (12 Suites, 780 Checks)
        env:
          EVAL_VENDOR_DIR: ${{ github.workspace }}/backend/vendor
          EVAL_UNIT: Dev
          EVAL_DB_HOST: 127.0.0.1
          EVAL_DB_PORT: '3307'
          EVAL_DB_NAME: eval_dev
          EVAL_DB_USER: eval_dev_runtime
          EVAL_DB_PASSWORD: ci_run_password
          EVAL_RUNTIME_PASSWORD: ci_run_password
          EVAL_MIGRATION_USER: eval_dev_migration
          EVAL_MIGRATION_PASSWORD: ci_mig_password
          EVAL_DB_ROLE: runtime
          EVAL_DB_SSL_VERIFY: '0'
        run: php dev-runtime/verify-all-backend.php
