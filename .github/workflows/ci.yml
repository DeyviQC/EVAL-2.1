name: EVAL CI Pipeline

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript & Tooling (Typecheck)
        run: npm run typecheck

      - name: Run 207 Automated Contract Tests
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

  backend:
    name: Backend Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP Syntax
        run: find app tests dev-runtime -name "*.php" -exec php -l {} \; > /dev/null

      - name: Run Core Domain Unit Tests (PHPUnit)
        run: ./vendor/bin/phpunit -c phpunit.xml --filter "TemporalBoundaryTest|WriteGuardPreconditionTest"
